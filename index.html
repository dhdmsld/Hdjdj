<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعت عنکبوتی</title>

    <!-- کتابخانه‌های GSAP (حتماً آنلاین) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MorphSVGPlugin.min.js"></script>

    <style>
        /* ===== ریست و پس‌زمینه ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            color: #fef97b;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* ===== محفظه‌ی ساعت ===== */
        #clock-wrapper {
            position: relative;
            aspect-ratio: 1/1;
            width: 65vh;          /* در حالت افقی */
        }
        @media (orientation: portrait) {
            #clock-wrapper {
                width: 85vw;      /* در حالت عمودی */
            }
        }

        /* ===== استایل SVG ===== */
        #clock-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===== چرخ‌دنده‌ها (ظاهر) ===== */
        .cog {
            fill: #f7f586;
            opacity: 0.3;
        }
        /* کلاس‌های جهت چرخش (با انیمیشن CSS ساده) */
        .cw  { animation: spin-cw  8s linear infinite; }
        .ccw { animation: spin-ccw 8s linear infinite; }

        @keyframes spin-cw {
            to { transform: rotate(360deg); }
        }
        @keyframes spin-ccw {
            to { transform: rotate(-360deg); }
        }

        /* ===== اعداد ساعت ===== */
        .hour-number {
            fill: #fef97b;
            font-size: 18px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
        }

        /* ===== عقربه‌ها ===== */
        .hand {
            stroke: #fef97b;
            stroke-linecap: round;
        }
        #hand-hour {
            stroke-width: 5;
        }
        #hand-minute {
            stroke-width: 4;
        }
        #hand-second {
            stroke-width: 2;
            stroke: #ff6b6b;
        }

        /* ===== نقطه‌ی مرکزی ===== */
        #center-dot {
            fill: #fef97b;
        }
    </style>
</head>
<body>

    <div id="clock-wrapper">
        <svg id="clock-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

            <!-- ===== تعریف چرخ‌دنده‌ها (برای استفاده با <use>) ===== -->
            <defs>
                <!-- چرخ‌دنده‌ی ساده (cog1) -->
                <g id="cog1">
                    <circle cx="0" cy="0" r="30" fill="none" stroke="#f7f586" stroke-width="6"/>
                    <circle cx="0" cy="0" r="18" fill="#f7f586" opacity="0.2"/>
                    <path d="M-6,-30 L6,-30 L4,-22 L-4,-22 Z" fill="#f7f586"/>
                    <path d="M-6,30 L6,30 L4,22 L-4,22 Z" fill="#f7f586"/>
                    <path d="M-30,-6 L-30,6 L-22,4 L-22,-4 Z" fill="#f7f586"/>
                    <path d="M30,-6 L30,6 L22,4 L22,-4 Z" fill="#f7f586"/>
                </g>
                <!-- چرخ‌دنده‌ی کوچک‌تر (cog2) -->
                <g id="cog2">
                    <circle cx="0" cy="0" r="20" fill="none" stroke="#f7f586" stroke-width="4"/>
                    <circle cx="0" cy="0" r="12" fill="#f7f586" opacity="0.2"/>
                    <path d="M-4,-20 L4,-20 L3,-15 L-3,-15 Z" fill="#f7f586"/>
                    <path d="M-4,20 L4,20 L3,15 L-3,15 Z" fill="#f7f586"/>
                    <path d="M-20,-4 L-20,4 L-15,3 L-15,-3 Z" fill="#f7f586"/>
                    <path d="M20,-4 L20,4 L15,3 L15,-3 Z" fill="#f7f586"/>
                </g>
                <!-- چرخ‌دنده‌ی دیگر (cog5) -->
                <g id="cog5">
                    <circle cx="0" cy="0" r="25" fill="none" stroke="#f7f586" stroke-width="5"/>
                    <circle cx="0" cy="0" r="15" fill="#f7f586" opacity="0.2"/>
                    <path d="M-5,-25 L5,-25 L4,-18 L-4,-18 Z" fill="#f7f586"/>
                    <path d="M-5,25 L5,25 L4,18 L-4,18 Z" fill="#f7f586"/>
                    <path d="M-25,-5 L-25,5 L-18,4 L-18,-4 Z" fill="#f7f586"/>
                    <path d="M25,-5 L25,5 L18,4 L18,-4 Z" fill="#f7f586"/>
                </g>

                <!-- ===== صورت‌های ساعت برای انیمیشن Morph ===== -->
                <g id="face-normal">
                    <circle cx="250" cy="250" r="200" fill="none" stroke="#fef97b" stroke-width="2" opacity="0.3"/>
                    <circle cx="250" cy="250" r="190" fill="none" stroke="#fef97b" stroke-width="1" opacity="0.2"/>
                    <!-- خط‌های کوچک دور تا دور (مثل ساعت) -->
                    <g id="ticks">
                        <!-- ۱۲ تیک بزرگ و ۶۰ تیک کوچک رو می‌تونیم با تکرار بسازیم، ولی اینجا فقط چندتا نمونه می‌ذاریم -->
                    </g>
                </g>

                <g id="face-spider">
                    <circle cx="250" cy="250" r="200" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.5"/>
                    <circle cx="250" cy="250" r="190" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
                    <!-- اضافه کردن چند خط منحنی مانند تار عنکبوت -->
                    <path d="M50,250 Q150,100 250,250 Q350,400 450,250" fill="none" stroke="#fef97b" stroke-width="1" opacity="0.3"/>
                    <path d="M250,50 Q100,150 250,250 Q400,350 250,450" fill="none" stroke="#fef97b" stroke-width="1" opacity="0.3"/>
                </g>

                <!-- عقربه‌ی ثانیه به دو شکل برای Morph -->
                <g id="handSec-normal">
                    <line x1="250" y1="250" x2="250" y2="70" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="250" cy="250" r="6" fill="#ff6b6b"/>
                </g>
                <g id="handSec-spider">
                    <line x1="250" y1="250" x2="250" y2="60" stroke="#fef97b" stroke-width="3" stroke-linecap="round"/>
                    <line x1="240" y1="80" x2="260" y2="80" stroke="#fef97b" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="250" cy="250" r="8" fill="#fef97b"/>
                </g>
            </defs>

            <!-- ===== چرخ‌دنده‌های متحرک (با کلاس‌های cw/ccw) ===== -->
            <g transform="translate(120, 120)">
                <use href="#cog1" class="cog cw" />
            </g>
            <g transform="translate(380, 120)">
                <use href="#cog2" class="cog ccw" />
            </g>
            <g transform="translate(380, 380)">
                <use href="#cog5" class="cog cw" />
            </g>
            <g transform="translate(120, 380)">
                <use href="#cog2" class="cog ccw" />
            </g>
            <g transform="translate(250, 100)">
                <use href="#cog1" class="cog cw" transform="scale(0.7)" />
            </g>

            <!-- ===== صورت ساعت (برای Morph) ===== -->
            <use href="#face-normal" id="face" />

            <!-- ===== اعداد ۱ تا ۱۲ ===== -->
            <g class="hour-numbers">
                <text x="250" y="80"  class="hour-number">۱۲</text>
                <text x="340" y="110" class="hour-number">۱</text>
                <text x="390" y="170" class="hour-number">۲</text>
                <text x="410" y="250" class="hour-number">۳</text>
                <text x="390" y="330" class="hour-number">۴</text>
                <text x="340" y="390" class="hour-number">۵</text>
                <text x="250" y="420" class="hour-number">۶</text>
                <text x="160" y="390" class="hour-number">۷</text>
                <text x="110" y="330" class="hour-number">۸</text>
                <text x="90"  y="250" class="hour-number">۹</text>
                <text x="110" y="170" class="hour-number">۱۰</text>
                <text x="160" y="110" class="hour-number">۱۱</text>
            </g>

            <!-- ===== عقربه‌ها ===== -->
            <!-- عقربه‌ی ساعت -->
            <line id="hand-hour" class="hand" x1="250" y1="250" x2="250" y2="140" />
            <!-- عقربه‌ی دقیقه -->
            <line id="hand-minute" class="hand" x1="250" y1="250" x2="250" y2="100" />
            <!-- عقربه‌ی ثانیه (با قابلیت Morph) -->
            <g id="hand-second-group">
                <use href="#handSec-normal" id="hand-second" />
            </g>

            <!-- ===== نقطه‌ی مرکزی ===== -->
            <circle id="center-dot" cx="250" cy="250" r="10" />

        </svg>
    </div>

    <script>
        // ============================================================
        //  کد JS – برگرفته از تصویر و تطبیق داده شده با ساعت واقعی
        // ============================================================

        // ---------- انتخاب المان‌ها ----------
        const hr = document.getElementById('hand-hour');
        const min = document.getElementById('hand-minute');
        const secGroup = document.getElementById('hand-second-group');
        const secUse = document.getElementById('hand-second'); // خود <use>
        const face = document.getElementById('face');

        // ---------- توابع محاسبه‌ی زاویه بر اساس زمان واقعی ----------
        function getHourRotation() {
            const now = new Date();
            const h = now.getHours() % 12;
            const m = now.getMinutes();
            // هر ساعت ۳۰ درجه (360/12) + هر دقیقه ۰.۵ درجه (30/60)
            return (h * 30) + (m * 0.5);
        }

        function getMinuteRotation() {
            const now = new Date();
            const m = now.getMinutes();
            const s = now.getSeconds();
            // هر دقیقه ۶ درجه (360/60) + هر ثانیه ۰.۱ درجه (6/60)
            return (m * 6) + (s * 0.1);
        }

        function getSecondRotation() {
            const now = new Date();
            const s = now.getSeconds();
            const ms = now.getMilliseconds();
            // هر ثانیه ۶ درجه + کسر میلی‌ثانیه برای حرکت پیوسته
            return (s * 6) + (ms * 0.006);
        }

        // تابع به‌روزرسانی زمان (برای لاگ یا کارهای دیگر)
        function setTimeSec() {
            // می‌توانید اینجا زمان را در کنسول بنویسید یا کار دیگری کنید
            // console.log('Second updated');
        }

        // ---------- انیمیشن عقربه‌ی ساعت (با چرخش ۳۶۰ درجه) ----------
        gsap.to(hr, 0.5, {
            rotation: getHourRotation,
            transformOrigin: "50% 50%",
            ease: "none",
            onComplete: function () {
                if (gsap.getProperty(hr, "rotation") >= 360) {
                    gsap.set(hr, { rotation: 0, transformOrigin: "50% 50%" });
                    this.invalidate().delay(5).restart(true);
                }
            }
        });

        // ---------- انیمیشن عقربه‌ی دقیقه ----------
        gsap.to(min, 0.5, {
            rotation: getMinuteRotation,
            transformOrigin: "50% 50%",
            ease: "none",
            onComplete: function () {
                if (gsap.getProperty(min, "rotation") >= 360) {
                    gsap.set(min, { rotation: 0, transformOrigin: "50% 50%" });
                    this.invalidate().delay(5).restart(true);
                }
            }
        });

        // ---------- انیمیشن عقربه‌ی ثانیه با حالت Bounce ----------
        gsap.to(secGroup, 0.5, {
            rotation: getSecondRotation,
            transformOrigin: "50% 50%",
            ease: "bounce",
            onComplete: function () {
                setTimeSec();
                if (gsap.getProperty(secGroup, "rotation") >= 360) {
                    gsap.set(secGroup, { rotation: 0, transformOrigin: "50% 50%" });
                    this.invalidate().delay(0).restart(true);
                }
            }
        });

        // ---------- تایم‌لاین اول: تغییر چهره (face ↔ face-spider) ----------
        let tg0 = gsap.timeline({
            repeat: -1,
            repeatDelay: 5,
            defaults: { duration: 0.5, ease: "power1.out" }
        });
        tg0.to("#face", {
            morphSVG: "#face-spider",
            repeat: 4,
            yoyo: true,
            onComplete: function () {
                // بعد از هر چرخه، تأخیر تصادفی ۰ تا ۰.۲۵ ثانیه
                tg0.repeatDelay(gsap.utils.random(0, 0.25));
            }
        });

        // ---------- تایم‌لاین دوم: تغییر عقربه‌ی ثانیه (بر اساس زاویه) ----------
        // این تایم‌لاین هر ۵ ثانیه یکبار بررسی می‌کند که اگر عقربه در محدوده‌های خاصی باشد،
        // عقربه را مورف کند.
        let tg1 = gsap.timeline({
            repeat: -1,
            repeatDelay: 5,
            defaults: { duration: 1.5, ease: "bounce" }
        });
        tg1.delay(1)
            .call(() => {
                // گرفتن زاویه‌ی فعلی عقربه‌ی ثانیه (عدد بین ۰ تا ۳۶۰)
                let rotation = parseFloat(gsap.getProperty(secGroup, "rotation").toFixed(1));
                // اگر زاویه بین ۳۰ تا ۱۵۰ یا ۲۱۰ تا ۳۳۰ درجه باشد، عقربه را عوض کن
                if ((rotation > 30 && rotation < 150) || (rotation > 210 && rotation < 330)) {
                    // یک تایم‌لاین موقت برای Morph عقربه
                    gsap.timeline({ repeat: 0, defaults: { duration: 0.25, ease: "bounce.in" } })
                        .to("#hand-second", { morphSVG: "#handSec-spider" })
                        .to("#hand-second", { morphSVG: "#handSec-normal" });
                }
            })
            .set(secGroup, {
                onComplete: function () {
                    // تنظیم تأخیر تصادفی برای تکرار بعدی
                    tg1.repeatDelay(gsap.utils.random(5, 10, 0.25));
                    tg1.delay(0);
                }
            });

        // ============================================================
        //  برای اجرای بی‌نهایت و رفرش خودکار، همه‌ی انیمیشن‌ها تنظیم شدن.
        //  حالا ساعت شما حرکت می‌کند و چهره و عقربه‌ها تغییر شکل می‌دهند.
        // ============================================================
    </script>

</body>
                  </html>
