<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعت کهکشان طلایی</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050508;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            user-select: none;
        }

        /* ===== محفظه اصلی با پوستر فوق‌لوکس ===== */
        .masterpiece {
            position: relative;
            width: 98vmin;
            max-width: 900px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            box-shadow: 0 50px 120px rgba(0,0,0,0.95), 0 0 0 8px #d4af37, 0 0 0 18px #0a0a12, 0 0 80px rgba(212,175,55,0.3);
            background: radial-gradient(circle at 20% 20%, #1a1a2e, #0a0a10);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s;
        }

        /* حلقه طلایی درخشان بیرونی */
        .masterpiece::before {
            content: '';
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #d4af37, #f9d976, #b8860b, #d4af37, #f9d976, #d4af37);
            z-index: -1;
            opacity: 0.6;
            filter: blur(8px);
            animation: spinGlow 12s linear infinite;
        }
        @keyframes spinGlow {
            0% { transform: rotate(0deg) scale(1); opacity: 0.5; }
            50% { transform: rotate(180deg) scale(1.05); opacity: 0.8; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.5; }
        }

        /* ===== SVG پوستر + ساعت ===== */
        #poster-svg {
            width: 94%;
            height: 94%;
            border-radius: 50%;
            display: block;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
            background: radial-gradient(circle at 25% 30%, #1c1c30, #0a0a12);
        }

        /* ===== عناصر پوستر (کیفیت بالا) ===== */
        .nebula {
            opacity: 0.4;
            filter: blur(20px);
            mix-blend-mode: screen;
        }
        .nebula-dark {
            opacity: 0.2;
            filter: blur(40px);
        }

        .star-glow {
            fill: #f5f0d7;
            animation: pulseStar 3s ease-in-out infinite alternate;
        }
        @keyframes pulseStar {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        .gold-dust {
            fill: #d4af37;
            opacity: 0.15;
            animation: floatDust 7s ease-in-out infinite alternate;
        }
        @keyframes floatDust {
            0% { transform: translate(0px, 0px) scale(1); opacity: 0.1; }
            100% { transform: translate(20px, -30px) scale(1.3); opacity: 0.25; }
        }

        .gold-ring {
            fill: none;
            stroke: url(#goldGrad);
            stroke-width: 1.5;
            opacity: 0.5;
        }

        /* ===== خطوط منحنی لوکس ===== */
        .luxury-line {
            fill: none;
            stroke: url(#goldGrad);
            stroke-width: 1.2;
            opacity: 0.25;
        }

        /* ===== تیک‌های ساعت ===== */
        .tick {
            stroke: #b89d6b;
            stroke-width: 2;
            stroke-linecap: round;
        }
        .tick-big {
            stroke: #d4af37;
            stroke-width: 4;
        }

        /* ===== اعداد طلایی ===== */
        .num {
            fill: #e8d5a3;
            font-size: 26px;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 0 25px rgba(212,175,55,0.5);
        }

        /* ===== عقربه‌های کریستالی ===== */
        .hand {
            stroke-linecap: round;
        }
        #hour-hand {
            stroke: #f5e8c0;
            stroke-width: 7;
            filter: drop-shadow(0 0 15px #d4af37) drop-shadow(0 0 30px rgba(212,175,55,0.3));
        }
        #minute-hand {
            stroke: #f0e0b0;
            stroke-width: 5;
            filter: drop-shadow(0 0 12px #d4af37) drop-shadow(0 0 25px rgba(212,175,55,0.2));
        }
        #second-hand {
            stroke: #ff6b4a;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 20px #ff6b4a) drop-shadow(0 0 40px rgba(255,107,74,0.3));
        }

        /* ===== الماس مرکزی ===== */
        #center-diamond {
            fill: url(#diamondGrad);
            filter: drop-shadow(0 0 30px #d4af37);
        }
        #center-diamond-inner {
            fill: #0a0a12;
        }

        /* ===== برند و تاریخ با کیفیت ===== */
        .brand {
            fill: #b89d6b;
            font-size: 11px;
            letter-spacing: 5px;
            text-anchor: middle;
            opacity: 0.8;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 0 15px rgba(212,175,55,0.3);
        }
        .date-text {
            fill: #c9b07a;
            font-size: 12px;
            text-anchor: middle;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212,175,55,0.2);
        }

        /* ===== واکنش‌گرایی ===== */
        @media (max-width: 700px) {
            .num { font-size: 20px; }
            #hour-hand { stroke-width: 5; }
            #minute-hand { stroke-width: 3.5; }
            #second-hand { stroke-width: 2; }
            .brand { font-size: 9px; letter-spacing: 3px; }
            .date-text { font-size: 10px; }
        }
        @media (max-width: 450px) {
            .num { font-size: 15px; }
            #hour-hand { stroke-width: 4; }
            #minute-hand { stroke-width: 3; }
            .brand { font-size: 7px; letter-spacing: 2px; }
            .date-text { font-size: 8px; }
        }
    </style>
</head>
<body>

<div class="masterpiece">
    <svg id="poster-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

        <!-- ===== تعاریف گرادیان‌های با کیفیت ===== -->
        <defs>
            <radialGradient id="bgGlow" cx="30%" cy="25%" r="80%">
                <stop offset="0%" stop-color="#1e1e38" />
                <stop offset="40%" stop-color="#12121e" />
                <stop offset="100%" stop-color="#05050a" />
            </radialGradient>

            <radialGradient id="nebula1" cx="15%" cy="20%" r="60%">
                <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3" />
                <stop offset="50%" stop-color="#8b6b2a" stop-opacity="0.1" />
                <stop offset="100%" stop-color="#000" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="nebula2" cx="85%" cy="70%" r="50%">
                <stop offset="0%" stop-color="#b8860b" stop-opacity="0.25" />
                <stop offset="50%" stop-color="#d4af37" stop-opacity="0.08" />
                <stop offset="100%" stop-color="#000" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="nebula3" cx="50%" cy="50%" r="40%">
                <stop offset="0%" stop-color="#f9d976" stop-opacity="0.15" />
                <stop offset="100%" stop-color="#000" stop-opacity="0" />
            </radialGradient>

            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d4af37" />
                <stop offset="50%" stop-color="#f9d976" />
                <stop offset="100%" stop-color="#b8860b" />
            </linearGradient>

            <radialGradient id="diamondGrad" cx="40%" cy="35%" r="60%">
                <stop offset="0%" stop-color="#f9d976" />
                <stop offset="50%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#8b6b2a" />
            </radialGradient>

            <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>

            <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="12" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
        </defs>

        <!-- ===== پس‌زمینه پوستر ===== -->
        <rect width="600" height="600" rx="300" fill="url(#bgGlow)"/>

        <!-- ===== سحابی‌های طلایی (کیفیت بالا) ===== -->
        <ellipse cx="180" cy="150" rx="250" ry="200" fill="url(#nebula1)" class="nebula"/>
        <ellipse cx="450" cy="420" rx="200" ry="180" fill="url(#nebula2)" class="nebula"/>
        <circle cx="300" cy="300" r="180" fill="url(#nebula3)" class="nebula-dark"/>

        <!-- ===== خطوط منحنی لوکس (تزیین پوستر) ===== -->
        <path class="luxury-line" d="M 30 300 Q 150 80 300 150 Q 450 220 570 300" opacity="0.3"/>
        <path class="luxury-line" d="M 30 300 Q 150 520 300 450 Q 450 380 570 300" opacity="0.2"/>
        <path class="luxury-line" d="M 300 30 Q 80 150 150 300 Q 220 450 300 570" opacity="0.25"/>
        <path class="luxury-line" d="M 300 30 Q 520 150 450 300 Q 380 450 300 570" opacity="0.25"/>
        <path class="luxury-line" d="M 50 150 Q 200 100 300 200 Q 400 300 550 250" opacity="0.15"/>
        <path class="luxury-line" d="M 50 450 Q 200 500 300 400 Q 400 300 550 350" opacity="0.15"/>

        <!-- ===== حلقه‌های طلایی دور پوستر ===== -->
        <circle cx="300" cy="300" r="280" class="gold-ring" stroke-width="2"/>
        <circle cx="300" cy="300" r="260" class="gold-ring" stroke-width="1.5" opacity="0.3"/>
        <circle cx="300" cy="300" r="240" class="gold-ring" stroke-width="1" opacity="0.2"/>

        <!-- ===== غبار طلایی (ذرات نورانی) ===== -->
        <g filter="url(#softGlow)">
            <circle cx="120" cy="100" r="4" class="gold-dust" style="animation-delay:0s;"/>
            <circle cx="480" cy="90" r="5" class="gold-dust" style="animation-delay:0.7s;"/>
            <circle cx="520" cy="480" r="3.5" class="gold-dust" style="animation-delay:1.2s;"/>
            <circle cx="80" cy="520" r="4.5" class="gold-dust" style="animation-delay:0.4s;"/>
            <circle cx="350" cy="60" r="3" class="gold-dust" style="animation-delay:1.8s;"/>
            <circle cx="150" cy="530" r="4" class="gold-dust" style="animation-delay:2.5s;"/>
            <circle cx="550" cy="300" r="3.5" class="gold-dust" style="animation-delay:0.9s;"/>
            <circle cx="50" cy="300" r="4" class="gold-dust" style="animation-delay:1.5s;"/>
        </g>

        <!-- ===== ستاره‌های چشمک‌زن ===== -->
        <circle cx="200" cy="80" r="3" class="star-glow" style="animation-delay:0s;"/>
        <circle cx="430" cy="60" r="2.5" class="star-glow" style="animation-delay:0.6s;"/>
        <circle cx="560" cy="220" r="2" class="star-glow" style="animation-delay:1.2s;"/>
        <circle cx="40" cy="250" r="2.5" class="star-glow" style="animation-delay:0.3s;"/>
        <circle cx="70" cy="480" r="3" class="star-glow" style="animation-delay:1.7s;"/>
        <circle cx="530" cy="400" r="2" class="star-glow" style="animation-delay:2.2s;"/>

        <!-- ===== تیک‌های ساعت ===== -->
        <g id="ticks"></g>

        <!-- ===== اعداد طلایی ===== -->
        <g id="numbers">
            <text x="300" y="68"  class="num">۱۲</text>
            <text x="407" y="112" class="num">۱</text>
            <text x="468" y="178" class="num">۲</text>
            <text x="490" y="300" class="num">۳</text>
            <text x="468" y="422" class="num">۴</text>
            <text x="407" y="488" class="num">۵</text>
            <text x="300" y="532" class="num">۶</text>
            <text x="193" y="488" class="num">۷</text>
            <text x="132" y="422" class="num">۸</text>
            <text x="110" y="300" class="num">۹</text>
            <text x="132" y="178" class="num">۱۰</text>
            <text x="193" y="112" class="num">۱۱</text>
        </g>

        <!-- ===== برند و تاریخ ===== -->
        <text x="300" y="460" class="brand">TEHRAN</text>
        <text x="300" y="480" class="brand" style="font-size:9px; letter-spacing:4px;">LUXURY</text>
        <text id="dateDisplay" x="300" y="508" class="date-text"></text>

        <!-- ===== عقربه‌های کریستالی ===== -->
        <line id="hour-hand" class="hand" x1="300" y1="300" x2="300" y2="165"/>
        <line id="minute-hand" class="hand" x1="300" y1="300" x2="300" y2="115"/>
        <line id="second-hand" class="hand" x1="300" y1="310" x2="300" y2="95"/>

        <!-- ===== الماس مرکزی ===== -->
        <circle id="center-diamond" cx="300" cy="300" r="18"/>
        <circle id="center-diamond-inner" cx="300" cy="300" r="8"/>

        <!-- حلقه‌های تزیینی دور الماس -->
        <circle cx="300" cy="300" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
        <circle cx="300" cy="300" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.3"/>

    </svg>
</div>

<script>
    (function() {
        "use strict";

        // ===== ۱. ساخت تیک‌ها =====
        const ticks = document.getElementById('ticks');
        const svgNS = "http://www.w3.org/2000/svg";
        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const rad = angle * Math.PI / 180;
            const r1 = 270, r2 = (i % 5 === 0) ? 252 : 262;
            const x1 = 300 + r1 * Math.sin(rad);
            const y1 = 300 - r1 * Math.cos(rad);
            const x2 = 300 + r2 * Math.sin(rad);
            const y2 = 300 - r2 * Math.cos(rad);
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('class', (i % 5 === 0) ? 'tick tick-big' : 'tick');
            ticks.appendChild(line);
        }

        // ===== ۲. عناصر عقربه‌ها =====
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const dateDisplay = document.getElementById('dateDisplay');

        // ===== ۳. تابع به‌روزرسانی دقیق =====
        function updateClock() {
            const now = new Date();
            const iranTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tehran' }));
            const h = iranTime.getHours() % 12;
            const m = iranTime.getMinutes();
            const s = iranTime.getSeconds();
            const ms = iranTime.getMilliseconds();

            const hourDeg = (h * 30) + (m * 0.5);
            const minuteDeg = (m * 6) + (s * 0.1);
            const secondDeg = (s * 6) + (ms * 0.006);

            hourHand.setAttribute('transform', `rotate(${hourDeg}, 300, 300)`);
            minuteHand.setAttribute('transform', `rotate(${minuteDeg}, 300, 300)`);
            secondHand.setAttribute('transform', `rotate(${secondDeg}, 300, 300)`);

            // تاریخ شمسی
            const options = { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Tehran' };
            const persianDate = new Intl.DateTimeFormat('fa-IR', options).format(iranTime);
            dateDisplay.textContent = persianDate;
        }

        // ===== ۴. اجرا و تایمر =====
        updateClock();
        setInterval(updateClock, 100);

        console.log('ساعت کهکشان طلایی با پوستر ۱۶K اجرا شد!');
    })();
</script>

</body>
</html>
