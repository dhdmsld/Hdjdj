<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعت لوکس تهران</title>
    <!-- فونت لاتین برای اعداد و استایل -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ========== ریست کامل ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Playfair Display', serif;
            overflow: hidden;
        }

        /* ========== محفظه ساعت ========== */
        .clock-container {
            position: relative;
            width: 70vmin;
            height: 70vmin;
            max-width: 600px;
            max-height: 600px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2b2b3a, #14141e);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                inset 0 -10px 30px rgba(255, 215, 0, 0.2),
                inset 0 10px 30px rgba(255, 215, 0, 0.1),
                0 0 0 8px #3a3a4a,
                0 0 0 12px #1f1f2b;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        /* حلقه طلایی دور ساعت */
        .clock-container::before {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37, #f9d976, #d4af37);
            z-index: -1;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.3);
        }

        /* ========== SVG ساعت ========== */
        #clock-svg {
            width: 92%;
            height: 92%;
            display: block;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #2e2e40, #15151f);
            box-shadow: inset 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        /* ========== اعداد ========== */
        .num {
            fill: #e8d5a3;
            font-size: 28px;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            font-family: 'Playfair Display', serif;
        }

        /* خطوط کوچک (تیک‌ها) */
        .tick {
            stroke: #b89d6b;
            stroke-width: 2;
            stroke-linecap: round;
        }
        .tick-big {
            stroke: #d4af37;
            stroke-width: 4;
        }

        /* ========== عقربه‌ها ========== */
        .hand {
            stroke-linecap: round;
            transition: transform 0.1s cubic-bezier(0.4, 2.5, 0.6, 1);
        }
        #hour-hand {
            stroke: #f0e0b0;
            stroke-width: 7;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
        }
        #minute-hand {
            stroke: #f5e8c0;
            stroke-width: 5;
            filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.3));
        }
        #second-hand {
            stroke: #ff6b4a;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 10px #ff6b4a);
        }

        /* ========== نقطه مرکزی ========== */
        #center-dot {
            fill: #d4af37;
            filter: drop-shadow(0 0 15px #d4af37);
        }
        #center-dot-inner {
            fill: #1a1a2e;
        }

        /* ========== لوگوی لوکس ========== */
        .brand {
            fill: #b89d6b;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 3px;
            text-anchor: middle;
            font-family: 'Playfair Display', serif;
            opacity: 0.7;
        }

        /* ========== نمایش تاریخ و روز ========== */
        .date-text {
            fill: #c9b07a;
            font-size: 13px;
            font-weight: 400;
            text-anchor: middle;
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
        }

        /* ========== واکنش‌گرایی ========== */
        @media (max-width: 500px) {
            .num { font-size: 18px; }
            .brand { font-size: 9px; }
            .date-text { font-size: 10px; }
            #hour-hand { stroke-width: 5; }
            #minute-hand { stroke-width: 4; }
            #second-hand { stroke-width: 2; }
        }

        /* انیمیشن درخشش ملایم */
        @keyframes glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .glow {
            animation: glow 3s ease-in-out infinite;
        }
    </style>
</head>
<body>

<div class="clock-container">
    <svg id="clock-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

        <!-- ===== تعریف فیلتر سایه‌ی نرم ===== -->
        <defs>
            <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
            </filter>
            <filter id="gold-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
        </defs>

        <!-- ===== دایره‌های پس‌زمینه ===== -->
        <circle cx="250" cy="250" r="235" fill="none" stroke="#3a3a4e" stroke-width="1" opacity="0.3"/>
        <circle cx="250" cy="250" r="225" fill="none" stroke="#2a2a3e" stroke-width="0.5" opacity="0.5"/>

        <!-- ===== ۶۰ خطک (تیک) ===== -->
        <g id="ticks">
            <!-- اینجا با استفاده از JS در پایین تولید می‌شود، ولی برای نمایش اولیه چندتا نمونه می‌گذاریم -->
        </g>

        <!-- ===== اعداد ۱ تا ۱۲ ===== -->
        <g id="numbers">
            <text x="250" y="55"  class="num">۱۲</text>
            <text x="348" y="95"  class="num">۱</text>
            <text x="405" y="160" class="num">۲</text>
            <text x="425" y="250" class="num">۳</text>
            <text x="405" y="340" class="num">۴</text>
            <text x="348" y="405" class="num">۵</text>
            <text x="250" y="445" class="num">۶</text>
            <text x="152" y="405" class="num">۷</text>
            <text x="95"  y="340" class="num">۸</text>
            <text x="75"  y="250" class="num">۹</text>
            <text x="95"  y="160" class="num">۱۰</text>
            <text x="152" y="95"  class="num">۱۱</text>
        </g>

        <!-- ===== برند / لوگو ===== -->
        <text x="250" y="390" class="brand">TEHRAN</text>
        <text x="250" y="408" class="brand" style="font-size:8px; letter-spacing:2px;">LUXURY</text>

        <!-- ===== نمایش تاریخ ===== -->
        <text id="date-display" x="250" y="430" class="date-text">---</text>

        <!-- ===== عقربه‌ها (با مرکز چرخش در ۲۵۰,۲۵۰) ===== -->
        <!-- عقربه ساعت -->
        <line id="hour-hand" class="hand" x1="250" y1="250" x2="250" y2="120" transform-origin="250 250"/>
        <!-- عقربه دقیقه -->
        <line id="minute-hand" class="hand" x1="250" y1="250" x2="250" y2="85" transform-origin="250 250"/>
        <!-- عقربه ثانیه -->
        <line id="second-hand" class="hand" x1="250" y1="280" x2="250" y2="70" transform-origin="250 250"/>

        <!-- ===== نقطه مرکزی ===== -->
        <circle id="center-dot" cx="250" cy="250" r="14"/>
        <circle id="center-dot-inner" cx="250" cy="250" r="7"/>

        <!-- المان تزیینی (حلقه طلایی کوچک دور مرکز) -->
        <circle cx="250" cy="250" r="20" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.3"/>

    </svg>
</div>

<script>
    (function() {
        "use strict";

        // ========== ۱. تولید تیک‌ها (۶۰ عدد) ==========
        const ticksContainer = document.getElementById('ticks');
        const svgNS = "http://www.w3.org/2000/svg";
        for (let i = 0; i < 60; i++) {
            const angle = i * 6; // هر تیک ۶ درجه
            const rad = angle * Math.PI / 180;
            const r1 = 225, r2 = (i % 5 === 0) ? 210 : 218; // تیک‌های بزرگ در multiples of 5
            const x1 = 250 + r1 * Math.sin(rad);
            const y1 = 250 - r1 * Math.cos(rad);
            const x2 = 250 + r2 * Math.sin(rad);
            const y2 = 250 - r2 * Math.cos(rad);
            const tick = document.createElementNS(svgNS, 'line');
            tick.setAttribute('x1', x1);
            tick.setAttribute('y1', y1);
            tick.setAttribute('x2', x2);
            tick.setAttribute('y2', y2);
            tick.setAttribute('class', (i % 5 === 0) ? 'tick tick-big' : 'tick');
            ticksContainer.appendChild(tick);
        }

        // ========== ۲. عناصر عقربه‌ها ==========
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const dateDisplay = document.getElementById('date-display');

        // ========== ۳. تابع به‌روزرسانی ساعت ==========
        function updateClock() {
            const now = new Date();
            // تنظیم منطقه زمانی ایران (UTC+3:30)
            const iranTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tehran' }));
            const h = iranTime.getHours() % 12;
            const m = iranTime.getMinutes();
            const s = iranTime.getSeconds();
            const ms = iranTime.getMilliseconds();

            // زاویه‌ها (بر حسب درجه)
            // عقربه ساعت: ۳۰ درجه به ازای هر ساعت + ۰.۵ درجه به ازای هر دقیقه
            const hourDeg = (h * 30) + (m * 0.5);
            // عقربه دقیقه: ۶ درجه به ازای هر دقیقه + ۰.۱ درجه به ازای هر ثانیه
            const minuteDeg = (m * 6) + (s * 0.1);
            // عقربه ثانیه: ۶ درجه به ازای هر ثانیه + ۰.۰۰۶ درجه به ازای هر میلی‌ثانیه
            const secondDeg = (s * 6) + (ms * 0.006);

            // اعمال transform با استفاده از rotate
            hourHand.setAttribute('transform', `rotate(${hourDeg}, 250, 250)`);
            minuteHand.setAttribute('transform', `rotate(${minuteDeg}, 250, 250)`);
            secondHand.setAttribute('transform', `rotate(${secondDeg}, 250, 250)`);

            // ========== ۴. نمایش تاریخ شمسی ==========
            const options = { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Tehran' };
            const persianDate = new Intl.DateTimeFormat('fa-IR', options).format(iranTime);
            dateDisplay.textContent = persianDate;
        }

        // ========== ۵. اجرای اولیه و تنظیم تایمر ==========
        updateClock();
        // به‌روزرسانی هر ۱۰۰ میلی‌ثانیه برای حرکت نرم ثانیه
        setInterval(updateClock, 100);

        // ========== ۶. (اختیاری) انیمیشن درخشش با کلاس glow ==========
        // می‌توان به المان‌ها کلاس glow داد، اما همین الان هم زیباست.

        // ========== ۷. تنظیم مجدد در صورت تغییر اندازه پنجره (اختیاری) ==========
        // نیازی نیست چون SVG مقیاس‌پذیر است.

        console.log('ساعت لوکس تهران با موفقیت اجرا شد!');
    })();
</script>

</body>
</html>
